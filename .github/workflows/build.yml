name: build

# Builds the binaries from source on every push / pull request and keeps them as workflow artifacts:
#   igdext64.dll         (shim, MSVC, static runtime), ControlLib.dll, amd_fidelityfx_upscaler_dx12.dll,
#                        amd_fidelityfx_framegeneration_dx12.dll and dxgi.dll (ffxfg/)
#   libvulkan_intel.so   (Mesa ANV with patches/*.patch applied, Arch Linux toolchain; stock-26.3.0: unpatched)
#   libVkLayer_xess_xmx.so (layer/, the Vulkan layer for an unpatched ANV)
# plus syntax checks of the scripts. Release binaries are still built and tested on the device (see docs/dev/building.md);
# these artifacts show that the tree builds and give Mesa ABI mismatches a place to surface.

# A push that only touches docs/ or Markdown runs nothing. Path filters are not evaluated for tag pushes, so a release
# tag always builds.
on:
  push:
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

# the jobs only read the tree and upload artifacts
permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shell syntax
        run: for f in *.sh tools/*.sh ffxfg/*.sh; do bash -n "$f" || exit 1; done
      - name: python syntax
        run: python3 -m py_compile tools/*.py
      - name: placeholder templates match the driver (shapes, magic, self-test values, DXBC checksums)
        run: |
          python3 tools/check_placeholders.py patches/0001-anv-cm-kernel-injection.patch
          python3 tools/check_placeholders.py patches/mesa-26.3/0001-anv-cm-kernel-injection.patch
      - name: the C-for-Metal files are the same in both patch series
        run: |
          for f in anv_cm.c anv_cm.h genX_cm.c; do
            for p in patches patches/mesa-26.3; do
              cat $p/0*.patch | awk -v f="b/src/intel/vulkan/$f" '/^diff --git /{on = ($4 == f)} /^(-- |From [0-9a-f]+ )/{on = 0} on' > /tmp/$(basename $p).$f
            done
            cmp /tmp/patches.$f /tmp/mesa-26.3.$f || { echo "$f differs between the series"; exit 1; }
          done
      - name: debug tools stay out of the feature patch
        run: |
          ! grep -n -E '^\+.*(ANV_CM_(GCAP|CAPTURE|VIEW|ONLY|SKIP|SYNC|MAXGROUPS|PREEMPT|PC)|anv_cm_bos|XMX-DEBUG)' patches/0001-anv-cm-kernel-injection.patch patches/mesa-26.3/0001-anv-cm-kernel-injection.patch

  icd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build
        run: |
          mkdir -p out
          gcc -O2 -Wall -shared -fPIC -fvisibility=hidden -o out/libvulkan_intel.so icd/xmx-icd.c -ldl -lpthread
          nm -D --defined-only out/libvulkan_intel.so | grep -c ' vk_icd' | grep -qx 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xmx-icd
          path: out/libvulkan_intel.so

  # layer/ of the release: VK_LAYER_XESS_xmx (xmx-stock.sh, the system's unpatched ANV). It needs VK_KHR_pipeline_binary,
  # newer than Ubuntu's headers: Vulkan-Headers at a fixed tag, checked against its commit
  layer:
    runs-on: ubuntu-latest
    env:
      VULKAN_HEADERS_TAG: vulkan-sdk-1.4.350.1
      VULKAN_HEADERS_COMMIT: 8864cdc896bbc2a9b6eb36b3218fc9ef57908d77
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: ${{ env.VULKAN_HEADERS_TAG }}
          path: vulkan-headers
      - name: Vulkan-Headers commit
        run: test "$(git -C vulkan-headers rev-parse HEAD)" = "$VULKAN_HEADERS_COMMIT"
      - name: toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends glslang-tools
      - name: build
        run: VULKAN_HEADERS="$PWD/vulkan-headers" bash layer/build.sh out
      - name: unit tests (those without IGC, kernel sets or a device are skipped by the script)
        run: bash layer/tests/build.sh out/tests
      - name: exports, glibc floor at most 2.38
        run: |
          nm -D --defined-only out/libVkLayer_xess_xmx.so | grep -q ' xmx_NegotiateLoaderLayerInterfaceVersion$'
          v=$(objdump -T out/libVkLayer_xess_xmx.so | grep -o 'GLIBC_2\.[0-9]*' | sort -t. -k2 -n -u | tail -1 | cut -d. -f2)
          echo "GLIBC_2.$v"; [ "$v" -le 38 ]
      - uses: actions/upload-artifact@v7
        with:
          name: xmx-layer
          path: |
            out/libVkLayer_xess_xmx.so
            out/VkLayer_xess_xmx.json

  # lib/bundled/ of the release: SPIRV-Tools and libdisplay-info for systems without them, built on Debian 12 so they
  # run on anything with glibc >= 2.36 (the drivers need 2.38)
  deps:
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build
        run: bash tools/build-deps.sh out
      - name: glibc floor at most 2.38, sonames the drivers ask for
        run: |
          cat out/SOURCES.txt
          for f in out/libSPIRV-Tools.so out/libdisplay-info.so.3; do
            v=$(objdump -T "$f" | grep -o 'GLIBC_2\.[0-9]*' | sort -t. -k2 -n -u | tail -1 | cut -d. -f2)
            echo "$f: GLIBC_2.$v"; [ "$v" -le 38 ]
          done
          objdump -p out/libdisplay-info.so.3 | grep -q 'SONAME *libdisplay-info\.so\.3$'
          objdump -T out/libSPIRV-Tools.so | grep -q ' spvContextCreate$'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundled-deps
          path: out/

  shim:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: configure
        run: cmake -S shim -B shim/build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: build
        run: cmake --build shim/build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: igdext64
          path: shim/build/igdext64.dll
      # XESS_FG (frame generation override): the stand-in for Intel's Control Library runtime
      - name: ControlLib.dll
        run: |
          mkdir controllib\build
          cl /nologo /O2 /W3 /MT /LD controllib\ControlLib.c /Focontrollib\build\ /Fe:controllib\build\ControlLib.dll /link dxgi.lib dxguid.lib
        shell: cmd
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ControlLib
          path: controllib/build/ControlLib.dll
      # FSR=xess: FSR 3.1+ upscaling on XeSS SR and frame generation on XeSS-FG, against the AMD and Intel headers
      # fetched at build time
      - name: FSR headers
        run: bash ffxfg/get-headers.sh
        shell: bash
      # OFLOW_FG=1: the optical flow (FidelityFX SDK 1.1.4, MIT) is linked into the frame generation DLL
      - name: FidelityFX SDK 1.1.4 optical flow libraries
        run: ffxfg\build-ffxsdk.bat
        shell: cmd
      - name: amd_fidelityfx_framegeneration_dx12.dll
        run: |
          mkdir ffxfg\build
          dxc -nologo -T cs_6_0 -E main -Vn g_oflowExpandCs -Fh ffxfg\build\oflow_expand_cs.h ffxfg\oflow_expand.hlsl || exit /b 1
          dxc -nologo -T cs_6_0 -E main -Vn g_oflowDownCs -Fh ffxfg\build\oflow_down_cs.h ffxfg\oflow_down.hlsl || exit /b 1
          cl /nologo /c /O2 /W3 /MT /EHsc /std:c++17 /I ffxfg\build /I ffxfg\ffxsdk\sdk\include ffxfg\ffx_oflow.cpp /Foffxfg\build\ || exit /b 1
          cl /nologo /O2 /W3 /MT /LD /EHsc /std:c++17 ffxfg\ffx_xefg.cpp ffxfg\build\ffx_oflow.obj /Foffxfg\build\ /Fe:ffxfg\build\amd_fidelityfx_framegeneration_dx12.dll /link dxguid.lib d3d12.lib ffxfg\ffxsdk\sdk\bin\ffx_sdk\ffx_opticalflow_x64.lib ffxfg\ffxsdk\sdk\bin\ffx_sdk\ffx_backend_dx12_x64.lib || exit /b 1
          dumpbin /exports ffxfg\build\amd_fidelityfx_framegeneration_dx12.dll | findstr /c:"ffxConfigure" /c:"ffxCreateContext" /c:"ffxDestroyContext" /c:"ffxDispatch" /c:"ffxQuery"
          dumpbin /exports ffxfg\build\amd_fidelityfx_framegeneration_dx12.dll | findstr /c:"XefgBridgeCreateSwapChain" /c:"XefgBridgeFrame"
        shell: cmd
      - name: amd_fidelityfx_upscaler_dx12.dll
        run: |
          cl /nologo /O2 /W3 /MT /LD /EHsc /std:c++17 ffxfg\ffx_xess.cpp /Foffxfg\build\ /Fe:ffxfg\build\amd_fidelityfx_upscaler_dx12.dll
          dumpbin /exports ffxfg\build\amd_fidelityfx_upscaler_dx12.dll | findstr /c:"ffxConfigure" /c:"ffxCreateContext" /c:"ffxDestroyContext" /c:"ffxDispatch" /c:"ffxQuery"
        shell: cmd
      # FSR_FG=inject: an XeSS-FG swap chain for a game without FSR frame generation
      - name: dxgi.dll
        run: |
          cl /nologo /O2 /W3 /MT /LD /EHsc /std:c++17 ffxfg\dxgi_xefg.cpp /Foffxfg\build\ /Fe:ffxfg\build\dxgi.dll
          dumpbin /exports ffxfg\build\dxgi.dll | findstr /c:"CreateDXGIFactory2" /c:"DXGIGetDebugInterface1"
        shell: cmd
      # XESS=latest for D3D11 games: XeSS for D3D11 on the D3D12 XeSS (dx11bridge/)
      - name: libxess_dx11.dll
        run: |
          mkdir dx11bridge\build
          fxc /nologo /T cs_5_0 /E main /O3 /Vn g_depthCopyCs /Fh dx11bridge\build\depth_copy_cs.h dx11bridge\depth_copy.hlsl || exit /b 1
          rc /nologo /fo dx11bridge\build\version.res dx11bridge\version.rc || exit /b 1
          cl /nologo /O2 /W3 /MT /LD /EHsc /std:c++17 /D_CRT_SECURE_NO_WARNINGS /I dx11bridge\build dx11bridge\xess_dx11.cpp dx11bridge\build\version.res /Fodx11bridge\build\ /Fe:dx11bridge\build\libxess_dx11.dll /link /DEF:dx11bridge\libxess_dx11.def d3d11.lib d3d12.lib dxgi.lib || exit /b 1
          dumpbin /exports dx11bridge\build\libxess_dx11.dll | findstr /c:"xessD3D11CreateContext" /c:"xessD3D11Execute" /c:"xessD3D11Init" /c:"xessDestroyContext"
        shell: cmd
      # XESS=latest for Vulkan games: vulkan-1.dll with XeSS' Intel interfaces (vkwrap/)
      - name: vulkan-1.dll
        run: |
          mkdir vkwrap\build
          python vkwrap\gen.py vkwrap\exports.txt vkwrap\build || exit /b 1
          ml64 /nologo /c /Fovkwrap\build\stubs.obj vkwrap\build\stubs.asm || exit /b 1
          cl /nologo /O2 /W3 /MT /LD /D_CRT_SECURE_NO_WARNINGS /I vkwrap\build vkwrap\vkwrap.c vkwrap\build\stubs.obj /Fovkwrap\build\ /Fe:vkwrap\build\vulkan-1.dll /link /DEF:vkwrap\build\vulkan-1.def || exit /b 1
          dumpbin /exports vkwrap\build\vulkan-1.dll | findstr /c:"vkGetDeviceProcAddr" /c:"vkCreateDevice" /c:"vkQueuePresentKHR"
        shell: cmd
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffx-xess
          path: |
            ffxfg/build/amd_fidelityfx_framegeneration_dx12.dll
            ffxfg/build/amd_fidelityfx_upscaler_dx12.dll
            ffxfg/build/dxgi.dll
            dx11bridge/build/libxess_dx11.dll
            vkwrap/build/vulkan-1.dll

  mesa:
    name: mesa ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 26.1.2
            mesa_sha256: bac2bca9121897a2b8162e79636b50ac998fca799c8e6cf914edd85962babdf0
            patches: patches
            arch_snapshot: 2026/09/20
          - name: 26.3.0
            mesa_sha256: 91d729aa68bb89e4ec857841300bbe922bcb3e52b1f97566ca83930d3b28343a
            patches: patches/mesa-26.3
            arch_snapshot: 2026/10/14
          # unpatched (lib/mesa-stock-26.3.0/): Xe3's default driver, with the Vulkan layer for the XMX kernels
          - name: stock-26.3.0
            version: 26.3.0
            mesa_sha256: 91d729aa68bb89e4ec857841300bbe922bcb3e52b1f97566ca83930d3b28343a
            patches: ""
            arch_snapshot: 2026/10/14
    env:
      MESA_VERSION: ${{ matrix.version || matrix.name }}
      MESA_SHA256: ${{ matrix.mesa_sha256 }}
      PATCHES: ${{ matrix.patches }}
      ARCH_SNAPSHOT: ${{ matrix.arch_snapshot }}
    steps:
      - name: toolchain (Arch Linux Archive snapshot, so every build uses the same package versions)
        run: |
          echo "Server=https://archive.archlinux.org/repos/${ARCH_SNAPSHOT}/\$repo/os/\$arch" > /etc/pacman.d/mirrorlist
          # the archive drops downloads now and then; finished packages stay in pacman's cache for the next try
          for try in 1 2 3 4; do
            pacman -Syyuu --noconfirm --needed base-devel git meson ninja python-mako python-yaml python-packaging \
              python-ply glslang spirv-tools spirv-headers spirv-llvm-translator llvm clang libclc libdrm \
              wayland wayland-protocols libx11 libxext libxrandr libxcb libxshmfence expat zlib zstd libelf && break
            [ "$try" != 4 ] || exit 1
            echo "toolchain download failed (try $try), waiting"
            sleep $((try * 60))
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the release tarball, not the git tag: upstream deleted the mesa-26.3.0-rc1 tag and its commit when staging/26.3
      # was branched again, and a tag can move; the tarball is checked against a fixed sha256
      - name: mesa source (release tarball from archive.mesa3d.org)
        run: |
          curl -sfLO --retry 4 --retry-delay 30 --retry-all-errors "https://archive.mesa3d.org/mesa-${MESA_VERSION}.tar.xz"
          echo "${MESA_SHA256}  mesa-${MESA_VERSION}.tar.xz" | sha256sum -c -
          mkdir mesa
          tar -xf "mesa-${MESA_VERSION}.tar.xz" -C mesa --strip-components=1
          git -C mesa init -q
          git -C mesa add -A
          git -C mesa -c user.name=ci -c user.email=ci@localhost commit -qm "mesa ${MESA_VERSION}"
      - name: apply patches
        run: |
          cd mesa
          [ -z "$PATCHES" ] || git -c user.name=ci -c user.email=ci@localhost am ../$PATCHES/0*.patch
      - name: configure
        run: |
          cd mesa
          meson setup build -Dprefix=/usr -Dsysconfdir=/etc -Dbuildtype=release -Dvulkan-drivers=intel -Dgallium-drivers= \
            -Dglx=disabled -Dgbm=disabled -Degl=disabled -Dgles1=disabled -Dgles2=disabled -Dopengl=false -Dllvm=enabled \
            -Dintel-rt=enabled -Dvideo-codecs= -Dvulkan-layers= -Dtools= '-Dcpp_link_args=-Wl,-rpath,$ORIGIN/../deps'
      - name: build
        run: ninja -C mesa/build src/intel/vulkan/libvulkan_intel.so
      - name: the driver reads the system's driconf (/usr/share/drirc.d)
        run: grep -aq '/usr/share/drirc.d' mesa/build/src/intel/vulkan/libvulkan_intel.so
      - name: dependencies of the driver (glibc / libstdc++ floor, unversioned sonames, run path lib/deps)
        run: |
          objdump -p mesa/build/src/intel/vulkan/libvulkan_intel.so | grep -E "NEEDED|RUNPATH"
          objdump -p mesa/build/src/intel/vulkan/libvulkan_intel.so | grep -q 'RUNPATH *[$]ORIGIN/[.][.]/deps$'
          objdump -T mesa/build/src/intel/vulkan/libvulkan_intel.so | grep -o "GLIBC_2\.[0-9]*" | sort -t. -k2 -n -u | tail -1
          objdump -T mesa/build/src/intel/vulkan/libvulkan_intel.so | grep -o "GLIBCXX_3\.4\.[0-9]*" | sort -t. -k3 -n -u | tail -1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name == '26.1.2' && 'libvulkan_intel' || format('libvulkan_intel-{0}', matrix.name) }}
          path: mesa/build/src/intel/vulkan/libvulkan_intel.so
          retention-days: 30   # release archives are packed from artifacts downloaded soon after the push
